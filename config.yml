run:
  dataset: CVC_ClinicDB          # CVC_ClinicDB | Kvasir_SEG | EDD_seg | PolypGen | Sun_seg
  epochs: 300
  warmup: 2
  lr: 0.001
  optimizer: adamw               # adamw | adam | sgd
  weight_decay: 0.05
  seed: 50
  resume: false
  checkpoint: EndoFormer

data:
  root: ./datasets/CVC-ClinicDB
  batch_size: 8
  num_workers: 4
  image_size: 352
  train_ratio: 0.8
  mean: 0.5
  std: 0.5

model:
  pretrained: ./pretrained/pvt_v2_b2.pth
  dims: [64, 128, 320, 512]
  out_dim: 32
  kernel_size: 3
  mlp_ratio: 4
  gla_ratio: 4
  gla_heads: 2

visualization:
  img_path: ./visualization/img/
  mask_path: ./visualization/label/
  output_path: ./visualization/output/
